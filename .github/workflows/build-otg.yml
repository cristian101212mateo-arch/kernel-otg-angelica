name: Build OTG Kernel for angelica

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y bc bison build-essential flex libssl-dev libelf-dev git zip python3 python-is-python3 cpio kmod rsync wget curl gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Clone kernel source
        run: git clone --depth=1 --branch halium-10.0 https://github.com/droidian-mt6765/kernel-xiaomi-mt6765.git kernel

      - name: Add usb0 label and DTC flag
        run: |
          cd kernel
          # 1. Añadir la etiqueta usb0 al nodo del DTS base
          sed -i 's/^\(\s*\)usb0@11200000 {/\1usb0: usb0@11200000 {/' arch/arm64/boot/dts/mediatek/mt6765.dts
          echo "=== Verificación etiqueta usb0 ==="
          grep -n "usb0@11200000" arch/arm64/boot/dts/mediatek/mt6765.dts
          
          # 2. Forzar la generación de símbolos para el DTB de mt6765
          echo 'DTC_FLAGS_mt6765 := -@' >> arch/arm64/boot/dts/mediatek/Makefile
          echo "=== Verificación DTC_FLAGS ==="
          tail -5 arch/arm64/boot/dts/mediatek/Makefile

      - name: Apply OTG overlay
        run: |
          cd kernel
          printf '// OTG overlay for angelica\n&usb0 {\n    dr_mode = "otg";\n    status = "okay";\n};\n' > arch/arm64/boot/dts/mediatek/otg-overlay.dtsi
          echo '#include "otg-overlay.dtsi"' >> arch/arm64/boot/dts/mediatek/angelica.dts
          echo "=== Últimas líneas de angelica.dts ==="
          tail -5 arch/arm64/boot/dts/mediatek/angelica.dts

      - name: Patch problem drivers only
        run: |
          cd kernel
          # Lista de drivers que fallan con GCC 9 -Werror
          for dir in \
            drivers/input/fingerprint/fpc \
            drivers/input/keyboard/mediatek \
            drivers/input/touchscreen/mediatek \
            drivers/input/misc \
            drivers/misc/mediatek; do
            if [ -f "$dir/Makefile" ]; then
              echo '' >> "$dir/Makefile"
              echo 'ccflags-y += -Wno-error -Wno-error=format -Wno-error=maybe-uninitialized -Wno-error=duplicate-decl-specifier' >> "$dir/Makefile"
              echo "✅ Parcheado: $dir/Makefile"
            fi
          done
          # Verificación
          echo "=== Últimas líneas del Makefile del kpd ==="
          tail -5 drivers/input/keyboard/mediatek/Makefile 2>/dev/null || echo "No existe kpd Makefile"
      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p out
          make O=out ARCH=arm64 angelica_halium_defconfig
          export KCFLAGS="-Wno-error -Wno-duplicate-decl-specifier -Wno-maybe-uninitialized"
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-

      - name: Package
        run: |
          cd kernel
          mkdir -p output
          cp out/arch/arm64/boot/Image.gz-dtb output/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz output/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/mediatek/angelica.dtb output/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/mediatek/mt6765.dtb output/ 2>/dev/null || true
          cd output && zip -r ../kernel-otg-angelica.zip . && cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-otg-angelica
          path: kernel/kernel-otg-angelica.zip
          retention-days: 30
