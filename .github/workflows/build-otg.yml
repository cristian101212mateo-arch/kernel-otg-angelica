name: Build OTG Kernel for angelica

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y bc bison build-essential flex libssl-dev libelf-dev git zip python3 python-is-python3 cpio kmod rsync wget curl gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Clone kernel source
        run: git clone --depth=1 --branch halium-10.0 https://github.com/droidian-mt6765/kernel-xiaomi-mt6765.git kernel

      - name: Apply OTG overlay
        run: |
          cd kernel
          printf '// OTG overlay for angelica\n&usb0 {\n    dr_mode = "otg";\n    status = "okay";\n};\n' > arch/arm64/boot/dts/mediatek/otg-overlay.dtsi
          echo '#include "otg-overlay.dtsi"' >> arch/arm64/boot/dts/mediatek/angelica.dts
          tail -5 arch/arm64/boot/dts/mediatek/angelica.dts

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p out
          make O=out ARCH=arm64 angelica_halium_defconfig
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tail -80

      - name: Package
        run: |
          cd kernel
          mkdir -p output
          cp out/arch/arm64/boot/Image.gz-dtb output/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz output/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/mediatek/angelica.dtb output/ 2>/dev/null || true
          cd output && zip -r ../kernel-otg-angelica.zip . && cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-otg-angelica
          path: kernel/kernel-otg-angelica.zip
          retention-days: 30
